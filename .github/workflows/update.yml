name: 更新賓果賓果開獎資料與統計

on:
  schedule:
    # 每 15 分鐘檢查一次新開獎（GitHub 排程在系統忙碌時可能延遲幾分鐘，屬正常現象）
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # 讓你在 GitHub 網頁上可以手動按「Run workflow」立刻跑一次

permissions:
  contents: write

concurrency:
  group: bingo-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取最新開獎資料
        run: python3 scrape.py

      - name: 重新計算統計結果
        run: python3 build_stats.py

      - name: 提交變更（若有新資料）
        run: |
          git config user.name "bingo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/draws.json data/stats.json
          git diff --cached --quiet || git commit -m "自動更新開獎資料 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
